name: Validate repository
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check repository structure and notebook hygiene
        run: python scripts/check_repository.py
      - name: Install CPU-only validation dependencies
        run: python -m pip install 'numpy>=1.26,<2' 'pandas>=2,<4' 'scikit-learn>=1.2,<2'
      - name: Regression checks for candidate selection
        run: python -m unittest discover -s tests -v
      - name: Activity calibration from saved scores
        run: python scripts/run_workflow.py activity
      - name: Validate activity submission
        run: python scripts/check_submission.py outputs/activity/submission.csv --reference data/raw/predictive-pet-zero-shot-test-2025.csv

